plugins {
    id 'com.android.application'
}

android {
    namespace 'com.streambdixplus.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.streambdixplus.launcher'
        minSdk 28
        targetSdk 28
        versionCode 8
        versionName '1.5.4'
    }

    buildTypes {
        debug {
            // CI publishes the debug build as the APK: it must not be debuggable.
            debuggable false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
