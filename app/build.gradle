plugins {
    id 'com.android.application'
}

android {
    namespace 'com.streambdixplus.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.streambdixplus.launcher'
        minSdk 28
        targetSdk 28
        versionCode 6
        versionName '1.5.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
